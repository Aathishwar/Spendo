<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Spendo">
  <!--
    A simple geometric mark, not an illustration: three bars, the shape the app's own
    daily chart makes. The mark sits inside the middle 60% so the same file survives
    Android's maskable crop.
  -->
  <rect width="512" height="512" rx="112" fill="#00695c"/>
  <g fill="#ffffff">
    <rect x="150" y="270" width="46" height="92"  rx="23"/>
    <rect x="233" y="196" width="46" height="166" rx="23"/>
    <rect x="316" y="150" width="46" height="212" rx="23"/>
  </g>
</svg>
